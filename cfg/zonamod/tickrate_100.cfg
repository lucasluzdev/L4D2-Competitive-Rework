// L4D2 - 100 tick competitive profile

sv_tickrate 105

// [Gameplay networking]
sm_cvar sv_minupdaterate 105
sm_cvar sv_maxupdaterate 105
sm_cvar sv_mincmdrate 105
sm_cvar sv_maxcmdrate 105

// Allow clients some bandwidth flexibility at 100 tick.
sm_cvar sv_minrate 105000
sm_cvar sv_maxrate 105000
sm_cvar net_splitpacket_maxrate 105000

// [Interpolation, lag compensation, clock correction]
sm_cvar sv_maxunlag 0.35
sm_cvar sv_client_min_interp_ratio 0
sm_cvar sv_client_max_interp_ratio 0
sm_cvar net_maxcleartime 0.0001
sm_cvar sv_clockcorrection_msecs 15
sm_cvar sv_unlag_fixstuck 1

// [Engine and tickrate fixes]
sm_cvar fps_max 0
sm_cvar tick_door_speed 1.3

// [NextBots: original Competitive Rework high-CPU tuning]
sm_cvar nb_update_frequency 0.014
sm_cvar nb_update_maxslide 1
sm_cvar nb_update_framelimit 5
