// L4D2 - 100 tick competitive profile

sv_tickrate 100

// [Gameplay networking]
sm_cvar sv_minupdaterate 100
sm_cvar sv_maxupdaterate 100
sm_cvar sv_mincmdrate 100
sm_cvar sv_maxcmdrate 100

// Allow clients some bandwidth flexibility at 100 tick.
sm_cvar sv_minrate 100000
sm_cvar sv_maxrate 100000
sm_cvar net_splitpacket_maxrate 100000

// [Interpolation, lag compensation, clock correction]
sm_cvar sv_maxunlag 0.35
sm_cvar sv_client_min_interp_ratio 0
sm_cvar sv_client_max_interp_ratio 0
sm_cvar net_maxcleartime 0.0001
sm_cvar sv_clockcorrection_msecs 20
sm_cvar sv_unlag_fixstuck 1

// [Engine and tickrate fixes]
// fps_max do SERVIDOR - em teste.
// 0 = sem limite (padrao do upstream, bom em maquina dedicada).
// 200 = limitado (valor atual): em hosts com limite de CPU (Pterodactyl/Docker), rodar frames sem
//       parar consome a cota de CPU e o kernel pausa o processo -> picos de "var".
// Teste: jogue alguns minutos com cada valor e compare o "var" do net_graph 4
// e o "stats" do console. Fique com o que der o var menor e mais estavel.
sm_cvar fps_max 200
sm_cvar tick_door_speed 1.3

// [NextBots: original Competitive Rework high-CPU tuning]
sm_cvar nb_update_frequency 0.014
sm_cvar nb_update_maxslide 1
sm_cvar nb_update_framelimit 5
