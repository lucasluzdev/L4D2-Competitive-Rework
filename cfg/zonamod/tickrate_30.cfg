// L4D2 - 30 tick Vanilla Versus profile (L4DToolz)

sv_tickrate 30

// [Gameplay networking]
sm_cvar sv_minupdaterate 30
sm_cvar sv_maxupdaterate 30
sm_cvar sv_mincmdrate 30
sm_cvar sv_maxcmdrate 30

// Allow clients some bandwidth flexibility at 30 tick.
sm_cvar sv_minrate 10000
sm_cvar sv_maxrate 30000
sm_cvar net_splitpacket_maxrate 30000

// [Interpolation, lag compensation, clock correction]
sm_cvar sv_maxunlag 0.35
sm_cvar sv_client_min_interp_ratio 1
sm_cvar sv_client_max_interp_ratio 2
sm_cvar net_maxcleartime 0.0001
sm_cvar sv_clockcorrection_msecs 60
sm_cvar sv_unlag_fixstuck 1

// [Engine and tickrate fixes]
sm_cvar fps_max 0
sm_cvar tick_door_speed 1.3

// [NextBots: closer to the game's stock scheduling]
sm_cvar nb_update_frequency 0.1
sm_cvar nb_update_maxslide 2
sm_cvar nb_update_framelimit 15
