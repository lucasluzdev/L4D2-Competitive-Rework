// [l4d2_zcs.smx] - infected class select in ghost
confogl_addcvar zcs_enable_vib 0
confogl_addcvar zcs_respectlimits 1
confogl_addcvar zcs_allowlastclass 1
confogl_addcvar zcs_switchinfinale 1
confogl_addcvar zcs_showhudpanel 1
confogl_addcvar zcs_zcselectkey 1
confogl_addcvar zcs_zcselectdelay 0.5

// [l4d2_tankbuster_t1 / tankbuster]
confogl_addcvar sm_tankbuster_enabled "1"
confogl_addcvar sm_tankbuster_limit "3"
confogl_addcvar sm_tankbuster_notify "1"
confogl_addcvar sm_tankbuster_empty_clip "1"
confogl_addcvar sm_tankbuster_smg_reserve "650"
confogl_addcvar sm_tankbuster_shotgun_reserve "80"

// [MeleeInTheSafeRoom.smx] - melee available for tankbusting
confogl_addcvar l4d2_MITSR_Enabled 1
