// Vanilla+ with SI swap - configuracoes exclusivas deste modo
// (o que e comum fica em cfgogl/vanillaplus_base/cvars.cfg)

// Armas T2 permanecem no mapa (o padrao do confogl e substituir, entao precisa ser 0)
confogl_addcvar confogl_replace_tier2               "0"
confogl_addcvar confogl_replace_tier2_finale        "0"
confogl_addcvar confogl_replace_tier2_all           "0"

// [l4d2_zcs.smx] - infected class select in ghost
confogl_addcvar zcs_enable_vib 0
confogl_addcvar zcs_respectlimits 1
confogl_addcvar zcs_allowlastclass 1
confogl_addcvar zcs_switchinfinale 1
confogl_addcvar zcs_showhudpanel 1
confogl_addcvar zcs_zcselectkey 1
confogl_addcvar zcs_zcselectdelay 0.5

// [MeleeInTheSafeRoom.smx] - melee available for tankbusting
confogl_addcvar l4d2_MITSR_Enabled 1
confogl_addcvar l4d2_MITSR_Random 1
confogl_addcvar l4d2_MITSR_Amount 4
confogl_addcvar l4d2_MITSR_Katana 1
confogl_addcvar l4d2_MITSR_FireAxe 1
confogl_addcvar l4d2_MITSR_Machete 1
confogl_addcvar l4d2_MITSR_Crowbar 1
confogl_addcvar l4d2_MITSR_GolfClub 1
confogl_addcvar l4d2_MITSR_CricketBat 1
confogl_addcvar l4d2_MITSR_BaseballBat 1
confogl_addcvar l4d2_MITSR_Tonfa 1
confogl_addcvar l4d2_MITSR_Knife 1
confogl_addcvar l4d2_MITSR_Pitchfork 1
confogl_addcvar l4d2_MITSR_Shovel 1

// [l4d2_tankbuster_t1] - SI: ilimitado, armas T1 + melee (exceto riot shield),
// arma ja vem carregada (cooldown de 5s fica na base, igual para todos)
confogl_addcvar sm_tankbuster_limit "0"
confogl_addcvar sm_tankbuster_empty_clip "0"
confogl_addcvar sm_tankbuster_melee "1"
