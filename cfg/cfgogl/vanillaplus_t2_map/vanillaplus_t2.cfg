// Vanilla+ T2 Limit settings

confogl_addcvar sm_skill_report_enable 1

// [l4d2_tier2_limiter.smx]
confogl_addcvar sm_t2_enabled "1"
confogl_addcvar sm_t2_limit "2"
confogl_addcvar sm_t2_notify "1"

// [L4DWeaponsMenu_restricted / tankbuster]
confogl_addcvar sm_tankbuster_enabled "1"
confogl_addcvar sm_tankbuster_limit "3"
confogl_addcvar sm_tankbuster_notify "1"
confogl_addcvar sm_tankbuster_empty_clip "1"
confogl_addcvar sm_tankbuster_smg_reserve "650"
confogl_addcvar sm_tankbuster_shotgun_reserve "80"

// ReadyUp
l4d_ready_enabled 1

// Configuracoes compartilhadas
confogl_addcvar l4d_ready_survivor_freeze "0"
confogl_addcvar l4d_ready_delay "3"
confogl_addcvar l4d_ready_enable_sound "1"
confogl_addcvar l4d_ready_chuckle "0"

sm_cvar z_tank_health 5334