sm plugins load optional/pause.smx

// Bosses (tank + witch em todo mapa, mesma posicao nas duas metades, !boss/!tank/!witch, !voteboss)
// Substitui o antigo disabled/zonamod/l4d2_boss_spawn_control.smx. Mesma ordem do zonemod.
// Faixas proibidas por mapa: tank_ban_flow / witch_ban_flow no mapinfo.txt de cada modo.
sm plugins load optional/bossspawningfix.smx
sm plugins load optional/l4d_boss_percent.smx
sm plugins load optional/l4d_boss_vote.smx
sm plugins load optional/witch_and_tankifier.smx
// !reroll (admin) - novo sorteio de tank/witch antes de sair da sala segura, com as regras do witch_and_tankifier
sm plugins load disabled/zonamod/l4d2_boss_reroll.smx
// !fixtank / !spawntank / !spawntankhere (admin) - tank preso no mapa, morto ao nascer ou que nao spawnou
sm plugins load disabled/zonamod/l4d2_tank_tools.smx

//-------------------------------------------
// Tank (mesmos do zonemod)
//-------------------------------------------
sm plugins load optional/rock_stumble_block.smx         // pedra nao some se o tank for empurrado durante o arremesso
sm plugins load optional/l4d_tankpunchstuckfix.smx      // sobrevivente nao fica preso no teto apos o soco
sm plugins load optional/l4d2_profitless_ai_tank.smx    // passar o tank para a IA nao da respawn instantaneo
sm plugins load optional/smart_ai_rock.smx              // tank da IA nao joga pedra por baixo
sm plugins load optional/l4d2_tank_announce.smx         // aviso no chat quando o tank nasce (som fica com o l4d_tank_damage_announce)
sm plugins load optional/l4d_tank_painfade.smx          // tela do tank fica vermelha ao levar dano de melee
sm plugins load optional/l4d2_tankrage.smx              // frustracao do tank congela quando os sobreviventes recuam
sm plugins load optional/l4d_tank_rush.smx              // pontos de distancia congelados enquanto o tank vive
sm plugins load optional/l4d2_tank_charger_m2_fix.smx   // empurrao (M2) nao deixa tank e charger lentos
// !cur / !current - progresso atual dos survivors (mesma escala do !boss)
sm plugins load optional/current.smx

