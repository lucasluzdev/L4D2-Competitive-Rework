// ============================================================================
// Vanilla+ base - cvars comuns a TODOS os modos Vanilla+
// (vanillaplus, vanillaplus_si, vanillaplus_t2, t1kits e variantes _map)
//
// Regras:
//  - Cada cvar aparece em um unico arquivo. Se um modo precisa de um valor
//    diferente, o cvar sai daqui e vai para o mode.cfg de cada modo.
//    (No confogl vale o PRIMEIRO confogl_addcvar; um segundo e ignorado.)
//  - Use confogl_addcvar, nao sm_cvar: o confogl reverte ao trocar de modo
//    e reaplica a cada round.
// Este arquivo nao e um modo (nao aparece no !match).
// ============================================================================

// Server Cvars
// sv_pure, sv_consistency, sv_cheats, voz, logs e lobby ficam no server.cfg
// (valem para todos os modos e sao reaplicados a cada troca de mapa).
confogl_addcvar vs_max_team_switches 9999
confogl_addcvar versus_marker_num 0
confogl_addcvar mp_gamemode "versus"


// ReadyUp (ligado em todos os modos; o off.cfg desliga ao sair do match)
l4d_ready_enabled 1
confogl_addcvar l4d_ready_survivor_freeze "0"
confogl_addcvar l4d_ready_delay "3"
confogl_addcvar l4d_ready_enable_sound "1"
confogl_addcvar l4d_ready_chuckle "0"

// Config Cvars
confogl_match_execcfg_off           "confogl_off.cfg"
confogl_match_execcfg_on            "confogl.cfg"
confogl_match_killlobbyres          "1"
confogl_match_restart               "1"

// Disable competitive item/weapon rewriting
// (confogl_replace_tier2* ficam no mode.cfg de cada modo: o t1kits usa 1, os outros 0)
confogl_addcvar confogl_boss_tank                   "0"
confogl_addcvar confogl_boss_unprohibit             "1"   // libera boss em mapas que normalmente proibem (exceto c7m1/c13m2)
confogl_addcvar confogl_lock_boss_spawns            "1"   // tank/witch na mesma posicao nas duas metades
confogl_addcvar confogl_remove_escape_tank          "0"
confogl_addcvar confogl_disable_tank_hordes         "0"
confogl_addcvar confogl_block_punch_rock            "0"
confogl_addcvar confogl_blockinfectedbots           "0"
confogl_addcvar director_allow_infected_bots        "1"
confogl_addcvar confogl_reduce_finalespawnrange     "0"
confogl_addcvar confogl_remove_chainsaw             "0"
confogl_addcvar confogl_remove_defib                "0"
confogl_addcvar confogl_remove_grenade              "0"
confogl_addcvar confogl_remove_m60                  "0"
confogl_addcvar confogl_remove_lasersight           "0"
confogl_addcvar confogl_remove_saferoomitems        "0"
confogl_addcvar confogl_remove_upg_explosive        "0"
confogl_addcvar confogl_remove_upg_incendiary       "0"
confogl_addcvar confogl_remove_statickits           "0"
confogl_addcvar confogl_replace_cssweapons          "1"   // MP5->SMG, SG552->M16, AWP->Military, Scout->Hunting (faca nao e afetada)
confogl_addcvar confogl_replace_startkits           "0"
confogl_addcvar confogl_replace_finalekits          "0"
confogl_addcvar confogl_waterslowdown               "0"
confogl_addcvar confogl_enable_itemtracking         "0"
confogl_addcvar confogl_itemtracking_savespawns     "0"
confogl_addcvar confogl_itemtracking_mapspecific    "0"
confogl_addcvar confogl_pills_limit                 "2"
confogl_addcvar confogl_adrenaline_limit            "1"
confogl_addcvar confogl_pipebomb_limit              "2"
confogl_addcvar confogl_molotov_limit               "2"
confogl_addcvar confogl_vomitjar_limit              "1"
confogl_addcvar confogl_SM_enable                   "0"
confogl_addcvar confogl_limit_tier2                 "0"
confogl_addcvar confogl_limit_tier2_saferoom        "0"
confogl_addcvar confogl_limit_sniper                "4"

// Keep medkits as medkits
confogl_addcvar director_vs_convert_pills 0
confogl_addcvar director_convert_pills 0
confogl_addcvar director_convert_pills_critical_health 0
confogl_addcvar director_convert_pills_to_defib_health 0

// Infectados: tempo de respawn dos SI
confogl_addcvar z_ghost_delay_min 18
confogl_addcvar z_ghost_delay_max 22

// Tank
// Vida: no versus o jogo multiplica por 1.5 -> 5334 * 1.5 = 8001 HP.
// Mantido como cvar (e nao via plugin) porque l4d_tank_damage_announce e
// l4d_tank_pass calculam a vida maxima a partir de z_tank_health.
confogl_addcvar z_tank_health 5334
// Fogo: o tank morre apos 200s queimando, independente da vida.
confogl_addcvar tank_burn_duration 200
// Melee: dano base contra o tank e 300; nerf de 30% -> 210 por golpe (mesmo valor do zonemod).
// Plugin: fixes/l4d2_melee_damage_control.smx (ja carregado pelo generalfixes.cfg).
confogl_addcvar l4d2_melee_damage_tank_nerf 30

// Bosses - substitui o antigo l4d2_boss_spawn_control
// Faixa de flow sorteada (10% a 86%). Faixas proibidas por mapa ficam em
// cfgogl/vanillaplus_base/mapinfo.txt (tank_ban_flow / witch_ban_flow).
confogl_addcvar versus_boss_flow_min 0.10
confogl_addcvar versus_boss_flow_max 0.86
// [witch_and_tankifier.smx] tank e witch em todo mapa
confogl_addcvar sm_tank_can_spawn 1
confogl_addcvar sm_witch_can_spawn 1
// witch fica a pelo menos 15% do tank (o valor e dividido para cada lado: 30 = +-15)
confogl_addcvar sm_witch_avoid_tank_spawn 30
// [bossspawningfix.smx]
confogl_addcvar l4d_obey_boss_spawn_cvars 1
confogl_addcvar l4d_obey_boss_spawn_except_static 1
// [l4d_boss_percent.smx] !boss / !tank / !witch
confogl_addcvar l4d_global_percent 0
confogl_addcvar l4d_tank_percent 1
confogl_addcvar l4d_witch_percent 1
// [l4d_boss_vote.smx] !voteboss <tank%> <witch%>
confogl_addcvar l4d_boss_vote 1
// Mapas sem tank/witch por flow (tank/witch fixo do mapa ou final). Comandos do witch_and_tankifier;
// o off.cfg limpa com reset_static_maps.
static_tank_map c4m5_milltown_escape
static_tank_map c5m5_bridge
static_tank_map c6m3_port
static_tank_map c7m1_docks
static_tank_map c7m3_port
static_tank_map c8m5_rooftop
static_tank_map c11m5_runway
static_tank_map c13m2_southpinestream
static_witch_map c1m4_atrium
static_witch_map c4m5_milltown_escape
static_witch_map c5m5_bridge
static_witch_map c6m1_riverbank
static_witch_map c6m3_port
static_witch_map c7m3_port
static_witch_map c8m5_rooftop
static_witch_map c11m5_runway

// [l4d2_tankbuster_t1] - carregado em todos os modos (vanillaplus_base/plugins.cfg)
// limit / empty_clip / melee variam por modo -> ficam no mode.cfg de cada modo
confogl_addcvar sm_tankbuster_enabled "1"
confogl_addcvar sm_tankbuster_notify "1"
confogl_addcvar sm_tankbuster_cooldown "5"   // segundos entre cada uso, por jogador
confogl_addcvar sm_tankbuster_smg_reserve "650"
confogl_addcvar sm_tankbuster_shotgun_reserve "80"

// [l4d2_tank_announce.smx] so o aviso no chat; o sino de spawn ja toca pelo l4d_tank_damage_announce
confogl_addcvar l4d2_tank_announce_sound 0
// [l4d_tank_painfade.smx] (valores do zonemod)
confogl_addcvar l4d_tank_painfade 1
confogl_addcvar l4d_tank_painfade_duration 300
confogl_addcvar l4d_tank_painfade_flags 8
// [l4d2_tankrage.smx] a cada 7% de recuo, a frustracao congela por 4s (valores do zonemod)
confogl_addcvar l4d2_tankrage_flowpercent 7
confogl_addcvar l4d2_tankrage_freezetime 4.0
// [l4d_tank_rush.smx] distancia congelada com o tank vivo; volta ao chegar na sala segura ou se o tank virar IA (valores do zonemod)
confogl_addcvar l4d_no_tank_rush 1
confogl_addcvar l4d_no_tank_rush_unfreeze_saferoom 1
confogl_addcvar l4d_no_tank_rush_unfreeze_ai 1
confogl_addcvar l4d_no_tank_rush_spawn_sound 0

// [spechud.smx] HUD de espectador ligado por padrao (cada um desliga com !spechud)
confogl_addcvar spechud_default_on 1

// [l4d2_skill_detect] - reports no chat
confogl_addcvar sm_skill_report_enable 1
confogl_addcvar sm_skill_report_skeet 1
confogl_addcvar sm_skill_report_hurtskeet 1
confogl_addcvar sm_skill_report_level 1
confogl_addcvar sm_skill_report_hurtlevel 1
confogl_addcvar sm_skill_report_crow 1
confogl_addcvar sm_skill_report_drawcrow 1
confogl_addcvar sm_skill_report_tonguecut 1
confogl_addcvar sm_skill_report_sc 1
confogl_addcvar sm_skill_report_scs 1
confogl_addcvar sm_skill_report_rockskeet 1
confogl_addcvar sm_skill_report_rockname 1
confogl_addcvar sm_skill_report_deadstop 1
confogl_addcvar sm_skill_report_pop 1
confogl_addcvar sm_skill_report_hunterdp 1
confogl_addcvar sm_skill_report_jockeydp 1
confogl_addcvar sm_skill_report_deadcharger 1
confogl_addcvar sm_skill_report_instanclear 1
confogl_addcvar sm_skill_report_bhop 1
confogl_addcvar sm_skill_report_caralarm 1
