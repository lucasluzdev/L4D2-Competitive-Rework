// T1 + medkits settings

confogl_addcvar sm_skill_report_enable 1

// Saferoom T1 preserve
confogl_addcvar sm_sr_t1_enabled "1"
confogl_addcvar sm_sr_t1_count "5"

// [L4DWeaponsMenu_restricted / tankbuster]
confogl_addcvar sm_tankbuster_enabled "1"
confogl_addcvar sm_tankbuster_limit "3"
confogl_addcvar sm_tankbuster_notify "1"
confogl_addcvar sm_tankbuster_empty_clip "1"
confogl_addcvar sm_tankbuster_smg_reserve "650"
confogl_addcvar sm_tankbuster_shotgun_reserve "80"

// ======================================
// T1 + Kits - Weapon Replacement Rules
// ======================================

// Limpar regras anteriores
l4d2_resetweaponrules

// Rifles de assalto -> SMGs T1
l4d2_addweaponrule rifle smg
l4d2_addweaponrule rifle_desert smg_silenced
l4d2_addweaponrule rifle_ak47 smg
l4d2_addweaponrule rifle_sg552 smg_silenced

// Escopetas automaticas -> Escopetas T1
l4d2_addweaponrule autoshotgun pumpshotgun
l4d2_addweaponrule shotgun_spas shotgun_chrome

// Snipers -> SMGs T1
l4d2_addweaponrule hunting_rifle smg
l4d2_addweaponrule sniper_military smg_silenced
l4d2_addweaponrule sniper_scout smg
l4d2_addweaponrule sniper_awp smg_silenced

// Armas especiais -> T1
l4d2_addweaponrule grenade_launcher pumpshotgun
l4d2_addweaponrule rifle_m60 smg_silenced