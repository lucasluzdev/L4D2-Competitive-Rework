// T1 + medkits instead of pills
// Vanilla plugins with ZoneMod stripper (T1 weapons), kits left as kits

l4d_ready_cfg_name "T1 + Medkits (ZoneMod Map Changes)"

confogl_addcvar mp_gamemode "versus"
confogl_addcvar z_difficulty "Impossible"

exec cfgogl/vanillaplus_map/shared_cvars.cfg

confogl_addcvar stripper_cfg_path cfg/stripper/zonamod
confogl_addcvar confogl_replace_startkits "0"
confogl_addcvar confogl_replace_finalekits "0"
confogl_addcvar confogl_remove_statickits "0"
confogl_addcvar confogl_replace_tier2_all "1"
confogl_addcvar confogl_replace_tier2 "1"
confogl_addcvar confogl_replace_tier2_finale "1"

exec cfgogl/t1kits/t1kits.cfg

// IMPORTANTE: aplicar as CVars registradas
confogl_setcvars