// Vanilla+ T2 Limit - configuracoes exclusivas deste modo (tambem usado pelo vanillaplus_t2_map)
// (o que e comum fica em cfgogl/vanillaplus_base/cvars.cfg)

// Armas T2 permanecem no mapa (o padrao do confogl e substituir, entao precisa ser 0)
confogl_addcvar confogl_replace_tier2               "0"
confogl_addcvar confogl_replace_tier2_finale        "0"
confogl_addcvar confogl_replace_tier2_all           "0"

// [l4d_weapon_limits.smx] - no maximo 2 sobreviventes com arma T2 ao mesmo tempo.
// Formato: l4d_wlimits_add <limite> <municao> <armas...>
// municao 1 = quem tenta pegar uma T2 bloqueada recebe municao para a arma atual.
// Os comandos sao ignorados depois do lock (este arquivo roda a cada mapa).
l4d_wlimits_add 2 1 weapon_rifle weapon_rifle_ak47 weapon_rifle_desert weapon_rifle_sg552 weapon_autoshotgun weapon_shotgun_spas weapon_hunting_rifle weapon_sniper_military weapon_sniper_awp weapon_sniper_scout
l4d_wlimits_lock

// [l4d2_tankbuster_t1] - padrao: so armas T1, 3 por jogador por mapa, sem municao no pente
confogl_addcvar sm_tankbuster_limit "3"
confogl_addcvar sm_tankbuster_empty_clip "1"
confogl_addcvar sm_tankbuster_melee "0"
