
// ============================================================================
// SafeRoom (BR) - Left 4 Dead 2 Dedicated Server
// ============================================================================
// Configuracao principal do servidor
// Modo inicial: Versus | Matchpadrao: Vanilla+
// Plugins: SourceMod / MetaMod / Confogl
// ============================================================================


// ============================================================================
// 01. IDENTIDADE DO SERVIDOR
// ============================================================================

hostname                       "SafeRoom (BR) - ZonaMod"
sv_contact                     "lucasluzdev@gmail.com"

sv_search_key                  "SafeRoom"
sv_tags                        "SafeRoom"

motd_enabled                   1
motdfile                       "mymotd.txt"
hostfile                       "myhost.txt"


// ============================================================================
// 02. ACESSO E SEGURANCA
// ============================================================================

// Administracao remota
rcon_password                  "leocuck2026"

// Protecao contra tentativas incorretas de autenticacao RCON
sv_rcon_minfailures             3
sv_rcon_maxfailures             3
sv_rcon_banpenalty              720       // Minutos de banimento

// Acesso ao servidor
sv_lan                         0         // Servidor publico (Internet)
sv_cheats                      0         // Desabilita cheats
sv_allow_lobby_connect_only    0         // Permite conexao direta

// Grupo Steam
sv_steamgroup                  46193038
sv_steamgroup_exclusive        1         // Prioriza membros do grupo quando vazio

// Controle de comandos dos clientes
sv_allow_wait_command          0
sv_pausable                    0


// ============================================================================
// 03. MODOS DE JOGO E PARTIDAS
// ============================================================================

// Modo de jogo inicial
sv_gametypes                   "versus"
sm_cvar mp_gamemode            versus

// Configuracoes das partidas
mp_roundlimit                  2
sm_cvar vs_max_team_switches   99
sm_cvar mp_autoteambalance     0

// Dificuldade
z_difficulty                   "Impossible"


// ============================================================================
// 04. JOGADORES E SLOTS
// ============================================================================

// Capacidade do servidor
sm_cvar mv_maxplayers          16
sv_visiblemaxplayers           16
sv_force_unreserved            0

// Limites por equipe
sm_cvar survivor_limit         4
sm_cvar z_max_player_zombies   4

// Carregamento dos personagens
sm_cvar precache_all_survivors 1


// ============================================================================
// 05. GAMEPLAY E INFECTADOS
// ============================================================================

// Tempo de respawn dos infectados especiais (segundos)
sm_cvar z_ghost_delay_min      18
sm_cvar z_ghost_delay_max      22

// Comportamento dos infectados
sm_cvar z_brawl_chance         0

// Duracao da queima do Tank
sm_cvar tank_burn_duration     200

// Multiplicadores de dano entre sobreviventes
survivor_friendly_fire_factor_easy     0
survivor_friendly_fire_factor_normal   0.1
survivor_friendly_fire_factor_hard     0.3
survivor_friendly_fire_factor_expert   0.5


// ============================================================================
// 06. REDE E PERFORMANCE
// ============================================================================

// Performance
sm_cvar sv_forcepreload                1
sm_cvar fps_max                        0
sv_alternateticks                      0

// Predicao e compensacao de latencia
sm_cvar sv_unlag_fixstuck              1
sm_cvar sv_maxunlag                    1
sm_cvar sv_client_predict              1
sm_cvar sv_client_cmdrate_difference   0
sm_cvar sv_clockcorrection_msecs       25
sm_cvar sv_player_stuck_tolerance      5

// Limites de consultas ao servidor
sm_cvar sv_max_queries_sec_global      10
sm_cvar sv_max_queries_sec             3
sm_cvar sv_max_queries_window          10

// Estatisticas
sm_cvar sv_stats                       0


// ============================================================================
// 07. CONSISTENCIA DE ARQUIVOS E ADDONS
// ============================================================================

// Validacao de arquivos dos clientes
sv_consistency                 1
sv_pure                        2
sv_pure_kick_clients            1

// Controle de addons do servidor
// -1 = Utiliza addonconfig.cfg
//  0 = Desabilita addons
//  1 = Habilita addons
sm_cvar l4d2_addons_eclipse    0


// ============================================================================
// 08. COMUNICACAO POR VOZ
// ============================================================================

sv_voiceenable                 1         // Habilita comunicacao por voz
sv_alltalk                     0         // Restringe voz conforme equipes


// ============================================================================
// 09. LOGS E REGISTROS
// ============================================================================

log                            on

sv_logecho                     0
sv_logfile                     1
sv_log_onefile                 0
sv_logbans                     1
sv_logflush                    0
sv_logsdir                     "logs"


// ============================================================================
// 10. BANIMENTOS
// ============================================================================

// Carrega listas de usuarios e IPs banidos
exec banned_user.cfg
exec banned_ip.cfg

// Persiste as listas de banimentos
writeip
writeid


// ============================================================================
// 11. SOURCEMOD E CONFOGL
// ============================================================================

// Arquivos de plugins carregados pelo Confogl no inicio do match
// Separar multiplos arquivos com ponto e virgula (;)
sm_cvar confogl_match_execcfg_plugins "generalfixes.cfg;confogl_plugins.cfg;sharedplugins.cfg"

// Comandos administrativos
mp_disable_autokick                    1
sm_cvar mp_disable_autokick            1

// NOTA:
// Vanilla+ e gerenciado pelas configuracoes de match (!match).
// Nao executar zonamod.cfg diretamente neste arquivo, pois suas
// configuracoes podem interferir em outros modos de jogo.


// ============================================================================
// 12. TICKRATE E CARREGAMENTO DO MATCH
// ============================================================================

// Configuracao de tickrate
exec zonamod/tickrate_100.cfg

// Match padrao
sm_forcematch vanillaplus

// Carregamento automatico do Confogl
confogl_match_autoload         "1"
confogl_match_autoconfig       "vanillaplus"


// ============================================================================
// FIM DO SERVER.CFG
// ============================================================================